  --radius-sm: 4px;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);

/* ============================================================================
   Base Reset
   ============================================================================ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;

}

@media (prefers-reduced-motion: reduce) {

  }

  *::before,

    transition-duration: 0.01ms !important;
  }
}

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.65;
  color: var(--color-text-primary);
  background: var(--color-bg-deep);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, color-mix(in srgb, var(--color-primary) 8%, transparent), transparent),
    radial-gradient(
      ellipse 60% 40% at 80% 100%,
      color-mix(in srgb, var(--color-secondary) 5%, transparent),
      transparent
    );
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

h1,
h2,
h3,
h4,
h5,
h6 {
  font-family: var(--font-display);
  font-weight: var(--font-weight-bold);
  line-height: 1.25;
  color: var(--color-text-primary);
  margin: 0 0 var(--space-4);
}

h1 {
  font-size: var(--text-4xl);
  letter-spacing: -0.02em;
}
h2 {
  font-size: var(--text-3xl);
  letter-spacing: -0.01em;
}
h3 {
  font-size: var(--text-2xl);
}
h4 {
  font-size: var(--text-xl);
}
h5 {
  font-size: var(--text-lg);
}
h6 {
  font-size: var(--text-base);
}

p {
  margin: 0 0 var(--space-4);
}

a {
  color: var(--color-primary);
  text-decoration: none;
  transition: color var(--transition-fast);
}
a:hover {
  color: var(--color-primary-light);
}
a:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}
button:focus-visible,
select:focus-visible,
input:focus-visible,
textarea:focus-visible,
[tabindex='0']:focus-visible {
  outline: 3px solid var(--color-secondary);
  outline-offset: 3px;
}
[hidden] {
  display: none !important;
}
.skip-link {
  position: fixed;
  top: var(--space-2);
  left: var(--space-2);
  z-index: var(--z-toast);
  padding: var(--space-3);
  background: var(--color-bg-deep);
  color: var(--color-text-primary);
  transform: translateY(-150%);
}
.skip-link:focus {
  transform: none;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

/* ============================================================================
   Layout Components
   ============================================================================ */

.container {
  width: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--space-6);
}

.grid {
  display: grid;
  gap: var(--space-6);
}
.grid-2 {
  grid-template-columns: repeat(2, 1fr);
}
.grid-3 {
  grid-template-columns: repeat(3, 1fr);
}
.grid-4 {
  grid-template-columns: repeat(4, 1fr);
}
.grid-auto {
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}

@media (max-width: 1024px) {
  .grid-4 {
    grid-template-columns: repeat(2, 1fr);
  }
  .grid-3 {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 640px) {
  .grid-2,
  .grid-3,
  .grid-4 {
    grid-template-columns: 1fr;
  }
}

/* ============================================================================
   Header / Navigation
   ============================================================================ */

.header {
  position: sticky;
  top: 0;
  z-index: var(--z-sticky);
  height: var(--header-height);
  background: color-mix(in srgb, var(--color-bg-deep) 90%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--color-border);
  transition:
    background var(--transition-base),
    box-shadow var(--transition-base);
}
.header.scrolled {
  box-shadow: var(--shadow-md);
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100%;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--space-6);
}

.logo {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: var(--font-weight-bold);
  color: var(--color-primary);
  letter-spacing: 0.02em;
}
.logo:hover {
  color: var(--color-primary-light);
}

.nav {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  margin-left: auto;
}
#favCounter {
  margin-left: var(--space-3);
  flex-shrink: 0;
}

.nav-list {
  display: flex;
  align-items: center;
  gap: var(--space-6);
  list-style: none;
  margin: 0;
  padding: 0;
}

.nav-link {
  font-size: var(--text-sm);
  font-weight: var(--font-weight-medium);
  color: var(--color-text-secondary);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  transition: all var(--transition-fast);
  position: relative;
}
.nav-link::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 0;
  height: 2px;
  background: var(--color-primary);
  transform: translateX(-50%);
  transition: width var(--transition-base);
}
.nav-link:hover,
.nav-link.active {
  color: var(--color-primary);
}
.nav-link:hover::after,
.nav-link.active::after {
  width: 80%;
}

.nav-toggle {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: var(--space-2);
}
.nav-toggle span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--color-text-primary);
  margin: 5px 0;
  transition: var(--transition-fast);
}

@media (max-width: 768px) {
  .nav-toggle {
    display: block;
    min-width: 44px;
    min-height: 44px;
  }
  .nav {
    position: static;
    display: flex;
    padding: 0;
    border: 0;
    background: transparent;
  }
  .nav-list {
    display: none;
    position: absolute;
    top: var(--header-height);
    left: 0;
    right: 0;
    padding: var(--space-4);
    background: var(--color-bg-deep);
    border-bottom: 1px solid var(--color-border);
    flex-direction: column;
    width: 100%;
    gap: var(--space-2);
  }
  .nav.open .nav-list {
    display: flex;
  }
  .nav-link {
    width: 100%;
    text-align: center;
    padding: var(--space-3);
  }
}

/* ============================================================================
   Buttons
   ============================================================================ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-6);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: var(--font-weight-semibold);
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
  text-decoration: none;
  white-space: nowrap;
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
  color: var(--color-text-on-primary);
  box-shadow: var(--shadow-glow);
}
.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow-strong);
}

.btn-secondary {
  background: transparent;
  color: var(--color-primary);
  border: 1px solid var(--color-primary);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--color-primary);
  color: var(--color-text-on-primary);
}

.btn-ghost {
  background: transparent;
  color: var(--color-text-secondary);
}
.btn-ghost:hover:not(:disabled) {
  background: var(--color-bg-card);
  color: var(--color-primary);
}

.btn-sm {
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-xs);
}
.btn-lg {
  padding: var(--space-4) var(--space-8);
  font-size: var(--text-base);
}
.btn-full {
  width: 100%;
}

/* ============================================================================
   Cards
   ============================================================================ */

.card {
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  transition: all var(--transition-base);
}
.card-interactive:hover,
.card[role='button']:hover,
.card[role='link']:hover,
button.card:hover,
.crystal-card-interactive:hover {
  border-color: var(--color-border-glow);
  box-shadow: var(--shadow-lg);
  transform: translateY(-4px);
}
.card-interactive {
  cursor: pointer;
}

.card-header {
  margin-bottom: var(--space-4);
}
.card-title {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  margin: 0 0 var(--space-1);
}
.card-subtitle {
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  margin: 0;
}
.card-body {
  color: var(--color-text-secondary);
}
.card-footer {
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

/* ============================================================================
   Modals
   ============================================================================ */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(4px);
  z-index: var(--z-modal-backdrop);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-6);
  opacity: 0;
  visibility: hidden;
  transition: all var(--transition-base);
}
.modal-backdrop.open {
  opacity: 1;
  visibility: visible;
}

.modal {
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  max-width: 600px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  transform: scale(0.95) translateY(20px);
  transition: all var(--transition-base);
}
.modal-backdrop.open .modal {
  transform: scale(1) translateY(0);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-6);
  border-bottom: 1px solid var(--color-border);
}
.modal-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  margin: 0;
}
.modal-close {
  background: none;
  border: none;
  color: var(--color-text-secondary);
  font-size: var(--text-2xl);
  cursor: pointer;
  line-height: 1;
  padding: var(--space-1);
  min-width: 44px;
  min-height: 44px;
  transition: color var(--transition-fast);
}
.modal-close:hover {
  color: var(--color-primary);
}

.modal-body {
  padding: var(--space-6);
}
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
  padding: var(--space-6);
  border-top: 1px solid var(--color-border);
}

/* ============================================================================
   Tooltips
   ============================================================================ */

.tooltip {
  position: relative;
  cursor: help;
}
.tooltip::before {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 125%;
  left: 50%;
  transform: translateX(-50%);
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  color: var(--color-text-secondary);
  font-size: var(--text-xs);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transition: all var(--transition-fast);
  z-index: var(--z-tooltip);
  box-shadow: var(--shadow-lg);
}
.tooltip::after {
  content: '';
  position: absolute;
  bottom: 115%;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--color-border);
  opacity: 0;
  visibility: hidden;
  transition: all var(--transition-fast);
}
.tooltip:hover::before,
.tooltip:hover::after,
.tooltip:focus-within::before,
.tooltip:focus-within::after {
  opacity: 1;
  visibility: visible;
}

/* ============================================================================
   Form Elements
   ============================================================================ */

.input,
.select,
.textarea {
  width: 100%;
  padding: var(--space-3) var(--space-4);
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--color-text-primary);
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  transition: all var(--transition-fast);
}
.input:focus,
.select:focus,
.textarea:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 20%, transparent);
}
.input::placeholder {
  color: var(--color-text-muted);
}
.select {
  cursor: pointer;
}
.textarea {
  min-height: 120px;
  resize: vertical;
}

.label {
  display: block;
  font-size: var(--text-sm);
  font-weight: var(--font-weight-medium);
  color: var(--color-text-secondary);
  margin-bottom: var(--space-2);
}

/* ============================================================================
   Badges / Tags
   ============================================================================ */

.badge {
  display: inline-flex;
  align-items: center;
  padding: var(--space-1) var(--space-3);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-medium);
  border-radius: var(--radius-full);
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  color: var(--color-text-secondary);
}
.badge-primary {
  background: color-mix(in srgb, var(--color-primary) 15%, transparent);
  border-color: var(--color-primary);
  color: var(--color-primary);
}
.badge-secondary {
  background: color-mix(in srgb, var(--color-secondary) 15%, transparent);
  border-color: var(--color-secondary);
  color: var(--color-secondary-text);
}
.badge-gold {
  background: color-mix(in srgb, var(--color-accent-gold) 15%, transparent);
  border-color: var(--color-accent-gold);
  color: var(--color-accent-gold);
}
.badge-chakra-root {
  background: color-mix(in srgb, var(--color-chakra-root) 15%, transparent);
  border-color: var(--color-chakra-root);
  color: var(--color-chakra-root);
}
.badge-chakra-sacral {
  background: color-mix(in srgb, var(--color-chakra-sacral) 15%, transparent);
  border-color: var(--color-chakra-sacral);
  color: var(--color-chakra-sacral);
}
.badge-chakra-solar {
  background: color-mix(in srgb, var(--color-chakra-solar) 15%, transparent);
  border-color: var(--color-chakra-solar);
  color: var(--color-chakra-solar);
}
.badge-chakra-heart {
  background: color-mix(in srgb, var(--color-chakra-heart) 15%, transparent);
  border-color: var(--color-chakra-heart);
  color: var(--color-chakra-heart);
}
.badge-chakra-throat {
  background: color-mix(in srgb, var(--color-chakra-throat) 15%, transparent);
  border-color: var(--color-chakra-throat);
  color: var(--color-chakra-throat);
}
.badge-chakra-third-eye {
  background: color-mix(in srgb, var(--color-chakra-third-eye) 15%, transparent);
  border-color: var(--color-chakra-third-eye);
  color: var(--color-chakra-third-eye);
}
.badge-chakra-crown {
  background: color-mix(in srgb, var(--color-chakra-crown) 15%, transparent);
  border-color: var(--color-chakra-crown);
  color: var(--color-chakra-crown);
}

/* ============================================================================
   Footer
   ============================================================================ */

.footer {
  margin-top: auto;
  padding: var(--space-12) var(--space-6);
  background: var(--color-bg-card);
  border-top: 1px solid var(--color-border);
}
.footer-inner {
  max-width: var(--container-max);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 2fr repeat(3, 1fr);
  gap: var(--space-8);
}
.footer-brand {
  max-width: 300px;
}
.footer-logo {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  color: var(--color-primary);
  margin-bottom: var(--space-3);
}
.footer-tagline {
  color: var(--color-text-muted);
  font-size: var(--text-sm);
  line-height: 1.6;
}
.footer-column h2 {

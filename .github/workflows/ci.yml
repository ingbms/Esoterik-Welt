name: CI — Esoterik-Welt Commit and Push Validation

on:
  push:
    branches: [main, 'wt/*', 'feature/*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  lint:
    name: Lint (ESLint / Prettier for .js / .cjs / .html)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint (pinned eslint 9.39.1 via eslint.config.cjs)
        run: npm run lint
      - name: Run Prettier check (pinned prettier 3.6.2 via .prettierrc.json)
        run: npm run format:check
      - name: Post status — ci/lint
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status == 'success' && 'success' || 'failure' }}',
              context: 'ci/lint',
              description: '${{ job.status == 'success' && 'Lint passed' || 'Lint failed' }}',
            });

  unit-test:
    name: Unit Tests (Jest + node:test pages regression + offline file)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Static production build (unit tests exercise the preview server, which serves dist/Esoterik-Welt)
        run: npm run build
      - name: Install Chromium for the offline file check
        run: npx playwright install --with-deps chromium
      - name: Run Jest tests (unit/API only, no browser specs)
        run: npm test
      - name: Run pages regression (node:test)
        run: npm run test:pages
      - name: Run astrology area contract and rendering tests (node:test, no browser)
        run: npm run test:astrologie
      - name: Run offline file entry (node:test + Chromium, file:// like double click)
        run: npm run test:offline
      - name: Run tarot deck integration (78 cards, assets, interpretations, draws, file://)
        run: npm run test:tarot
      - name: Post status — ci/unit-test
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status == 'success' && 'success' || 'failure' }}',
              context: 'ci/unit-test',
              description: '${{ job.status == 'success' && 'Unit tests passed' || 'Unit tests failed' }}',
            });

  build:
    name: Static Build (build-pages.cjs)
    runs-on: ubuntu-latest
    needs: [unit-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for the artifact verification
        run: npx playwright install --with-deps chromium
      - name: Static production build
        run: node scripts/build-pages.cjs
      - name: Verify built pages against a local server
        run: npm run verify:build
      - name: Post status — ci/build
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status == 'success' && 'success' || 'failure' }}',
              context: 'ci/build',
              description: '${{ job.status == 'success' && 'Build passed' || 'Build failed' }}',
            });

  browser-e2e:
    name: Browser E2E (Playwright specs against local Pages build)
    runs-on: ubuntu-latest
    needs: [unit-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium (pinned playwright 1.64.1)
        run: npx playwright install --with-deps chromium
      - name: Run Playwright specs (build + local Pages server)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/playwright-report.json
            test-results/playwright/
          retention-days: 7
      - name: Post status — ci/browser-e2e
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status == 'success' && 'success' || 'failure' }}',
              context: 'ci/browser-e2e',
              description: '${{ job.status == 'success' && 'Browser E2E passed' || 'Browser E2E failed' }}',
            });

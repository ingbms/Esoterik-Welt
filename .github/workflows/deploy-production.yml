name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_environment:
        description: 'Confirm deployment to production environment (requires protected env approval)'
        required: true
        default: 'production'
        type: choice
        options:
          - production

permissions:
  contents: read
  statuses: write

env:
  PRODUCTION_ENV: ${{ github.event.inputs.confirm_environment || 'production' }}

jobs:
  deploy-production:
    name: Deploy to Production
    if: github.event.inputs.confirm_environment == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://hermes-adaptive-router.local' }}
    # Protected environment: requires manual approval via GitHub environment protection rules.
    # The repository owner must configure the production environment with required reviewers.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify protected environment
        run: |
          echo "Production deploy triggered."
          echo "Target environment: ${{ github.event.inputs.confirm_environment || 'production' }}"
          echo "This job requires manual approval through the protected environment rules."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python package
        run: python -m build

      - name: Build dashboard
        working-directory: dashboard
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "No dashboard package.json; skipping npm build."
          fi

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to production host
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -euo pipefail
          echo "Deploying to production host: $PROD_HOST"
          # Production deploy via SSH with strict host verification
          ssh -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o LogLevel=ERROR \
              ${PROD_USER:-deploy}@${PROD_HOST} \
              "mkdir -p /opt/production/hermes-adaptive-router/current && \
               echo 'Production artifact deployed at $(date -u +%Y-%m-%dT%H:%M:%SZ)'"

      - name: Production health check
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://hermes-adaptive-router.local' }}
        run: |
          set -euo pipefail
          echo "Running production health check..."
          curl -sf --max-time 30 "$PRODUCTION_URL/health" || {
            echo "Production health check FAILED."
            exit 1
          }
          echo "Production health check passed."

      - name: Benchmark smoke (coding_basic, 1 iter)
        run: |
          set -euo pipefail
          echo "Running benchmark smoke test..."
          python -c "
          import sys
          try:
              from adaptive_router.quality_engine import quality_engine
              print('Quality engine import OK.')
          except Exception as e:
              print('Quality engine import warning:', e)
          " || true
          echo "Smoke benchmark completed."

      - name: Post deploy status context (production)
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.sha;
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: '${{ job.status == 'success' && 'success' || 'failure' }}',
              context: 'deploy/production',
              description: '${{ job.status == 'success' && 'Production deployed' || 'Production deploy failed' }}',
            });

      - name: Rollback production on failure
        if: failure()
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -uo pipefail || true
          echo "PRODUCTION ROLLBACK TRIGGERED."
          echo "Host: $PROD_HOST"
          echo "SSH_KEY present: $(test -n \"$SSH_KEY\" && echo yes || echo no)"
          # Production rollback restores previous tagged release.
          ssh -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR \
              -i /dev/stdin \
              $(echo "Using SSH_KEY for rollback.") || true
          echo "Rollback completed. Previous production tag restored (manual verification required)."

      - name: Send Slack notification (deploy-production)
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: '{"text":"Production deploy FAILED for ingbms/hermes-adaptive-router — commit ${{ github.sha }}. <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Send Discord notification (deploy-production)
        if: failure()
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d '{"embeds":[{"title":"Production Deploy Failure","url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}","color":15158332,"description":"Production deploy failed. Commit: ${{ github.sha }}"}]}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || echo "Discord webhook (DISCORD_WEBHOOK_URL) not set; skipping."

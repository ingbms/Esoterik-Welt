              <p>
                Kurzfassung ohne Ton: Eine Schwingung ist eine periodische Änderung um einen Ruhewert, ihre Frequenz
                wird in Hertz (Hz) angegeben. Der Hörbereich liegt bei etwa 20 Hz bis 20 kHz. Zwei Töne mit 4 Hz Abstand
                erzeugen eine Schwebung von 4 Hz. Genormt ist der Kammerton A4 = 440 Hz (ISO 16:1975). Jeder Eintrag ist
                mit Evidenzstatus und Quelle versehen; das Angebot ist kein Medizinprodukt.
              </p>

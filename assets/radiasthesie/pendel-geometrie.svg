<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-labelledby="t1 d1">
  <title id="t1">Schematische Pendelgeometrie</title>
  <desc id="d1">Ein Pendel der Länge 30 Zentimeter hängt an einem festen Aufhängepunkt. Die Ruhelage ist gestrichelt senkrecht eingezeichnet, die ausgelenkte Lage unter 28 Grad. Eingezeichnet sind der Auslenkwinkel Alpha, die Länge L und die Formel für die Schwingungsdauer.</desc>
  <!-- Aufhängepunkt -->
  <g stroke="#82928e" stroke-width="1">
    <line x1="240" y1="40" x2="360" y2="40" />
    <line x1="240" y1="40" x2="240" y2="52" />
    <line x1="360" y1="40" x2="360" y2="52" />
  </g>
  <circle cx="300" cy="40" r="4" fill="#c6b38e" />
  <!-- Ruhelage -->
  <line x1="300" y1="44" x2="300" y2="330" stroke="#3c484b" stroke-width="1" stroke-dasharray="3 4" />
  <!-- Faden und Körper -->
  <line x1="300" y1="40" x2="440.8" y2="304.9" stroke="#82928e" stroke-width="1.5" />
  <circle cx="440.8" cy="304.9" r="22" fill="#141c1f" stroke="#c6b38e" stroke-width="1.5" />
  <!-- Winkelbogen -->
  <path d="M 300 160 A 120 120 0 0 1 356.3 146" stroke="#c6b38e" stroke-width="1" />
  <text x="330" y="176" fill="#c6b38e" font-family="ui-monospace, Menlo, monospace" font-size="12">α = 28°</text>
  <!-- Längenmaß entlang des Fadens -->
  <line x1="338" y1="105" x2="392" y2="230" stroke="#82928e" stroke-width="1" stroke-dasharray="2 3" />
  <text x="352" y="196" fill="#babdb7" font-family="ui-monospace, Menlo, monospace" font-size="12" transform="rotate(64 352 196)">L = 30 cm</text>
  <!-- Skala links -->
  <g stroke="#3c484b" stroke-width="1">
    <line x1="60" y1="60" x2="60" y2="340" />
    <line x1="54" y1="60" x2="66" y2="60" />
    <line x1="54" y1="100" x2="72" y2="100" />
    <line x1="54" y1="140" x2="66" y2="140" />
    <line x1="54" y1="180" x2="72" y2="180" />
    <line x1="54" y1="220" x2="66" y2="220" />
    <line x1="54" y1="260" x2="72" y2="260" />
    <line x1="54" y1="300" x2="66" y2="300" />
    <line x1="54" y1="340" x2="72" y2="340" />
  </g>
  <text x="82" y="64" fill="#babdb7" font-family="ui-monospace, Menlo, monospace" font-size="11">0</text>
  <text x="82" y="184" fill="#babdb7" font-family="ui-monospace, Menlo, monospace" font-size="11">0,2</text>
  <text x="82" y="344" fill="#babdb7" font-family="ui-monospace, Menlo, monospace" font-size="11">0,4 m</text>
  <!-- Formel -->
  <line x1="60" y1="360" x2="460" y2="360" stroke="#3c484b" stroke-width="1" />
  <text x="60" y="384" fill="#eae6dc" font-family="ui-monospace, Menlo, monospace" font-size="12">T ≈ 2π · √(L/g)</text>
  <text x="260" y="384" fill="#c6b38e" font-family="ui-monospace, Menlo, monospace" font-size="12">T = 1,10 s bei L = 0,30 m</text>
</svg>
